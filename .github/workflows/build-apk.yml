name: Build Pneumo Formeln APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Generate Android project from this single workflow file
        shell: bash
        run: |
          mkdir -p app/src/main/assets app/src/main/java/at/drsaad/pneumoformeln
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = 'PneumoFormeln'
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.7.3' apply false }
          EOF
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android { namespace 'at.drsaad.pneumoformeln'; compileSdk 35; defaultConfig { applicationId 'at.drsaad.pneumoformeln'; minSdk 23; targetSdk 35; versionCode 1; versionName '1.0' } }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:allowBackup="false" android:label="Pneumo Formeln" android:theme="@android:style/Theme.Material.Light.NoActionBar"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>
          EOF
          cat > app/src/main/java/at/drsaad/pneumoformeln/MainActivity.java <<'EOF'
          package at.drsaad.pneumoformeln;
          import android.app.Activity; import android.os.Bundle; import android.webkit.WebView; import android.webkit.WebSettings; import android.webkit.WebViewClient;
          public class MainActivity extends Activity { private WebView w; @Override public void onCreate(Bundle b){super.onCreate(b);w=new WebView(this);WebSettings s=w.getSettings();s.setJavaScriptEnabled(true);s.setDomStorageEnabled(true);s.setAllowFileAccess(true);w.setWebViewClient(new WebViewClient());setContentView(w);w.loadUrl("file:///android_asset/index.html");} @Override public void onBackPressed(){if(w!=null&&w.canGoBack())w.goBack();else super.onBackPressed();} }
          EOF
          : > /tmp/pneumo.html.b64
          printf '%s' '' >> /tmp/pneumo.html.b64
          printf '%s' '' >> /tmp/pneumo.html.b64
          printf '%s' '' >> /tmp/pneumo.html.b64
          printf '%s' '' >> /tmp/pneumo.html.b64
          printf '%s' '' >> /tmp/pneumo.html.b64
          printf '%s' '' >> /tmp/pneumo.html.b64
          printf '%s' '' >> /tmp/pneumo.html.b64
          printf '%s' '' >> /tmp/pneumo.html.b64
          printf '%s' '' >> /tmp/pneumo.html.b64
          printf '%s' '' >> /tmp/pneumo.html.b64
          printf '%s' '' >> /tmp/pneumo.html.b64
          printf '%s' '' >> /tmp/pneumo.html.b64
          printf '%s' '' >> /tmp/pneumo.html.b64
          printf '%s' '' >> /tmp/pneumo.html.b64
          printf '%s' '' >> /tmp/pneumo.html.b64
          printf '%s' '' >> /tmp/pneumo.html.b64
          printf '%s' '' >> /tmp/pneumo.html.b64
          printf '%s' '' >> /tmp/pneumo.html.b64
          printf '%s' '' >> /tmp/pneumo.html.b64
          printf '%s' '' >> /tmp/pneumo.html.b64
          printf '%s' '' >> /tmp/pneumo.html.b64
          printf '%s' '' >> /tmp/pneumo.html.b64
          printf '%s' '' >> /tmp/pneumo.html.b64
          printf '%s' '' >> /tmp/pneumo.html.b64
          printf '%s' '' >> /tmp/pneumo.html.b64
          printf '%s' '' >> /tmp/pneumo.html.b64
          printf '%s' '' >> /tmp/pneumo.html.b64
          printf '%s' '' >> /tmp/pneumo.html.b64
          printf '%s' '' >> /tmp/pneumo.html.b64
          printf '%s' '' >> /tmp/pneumo.html.b64
          printf '%s' '' >> /tmp/pneumo.html.b64
          base64 -d /tmp/pneumo.html.b64 > app/src/main/assets/index.html
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pneumo-Formeln-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
